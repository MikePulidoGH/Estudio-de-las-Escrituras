<style>

body{font-size:16px; line-height:1.5; padding-bottom:40px;}
.wrap{max-width:760px; margin:0 auto; padding:14px;}

header.apph .wrap{display:flex; justify-content:space-between; align-items:center; padding-top:10px; padding-bottom:10px;}

h1 small{display:block; color:var(--muted); font-size:.72rem; font-weight:400;}

.btn:active{transform:scale(.97);}
.btn.acc{background:var(--accent); color:#123;border-color:var(--accent); font-weight:600;}
.btn.small{padding:5px 10px; font-size:.8rem; border-radius:9px;}
.btn.ghost{background:transparent;}
.iconbtn{padding:6px 10px; font-size:1rem;}
h2{font-size:1.15rem; color:var(--accent2); margin:22px 0 8px;}
h3{font-size:1rem; margin:14px 0 6px;}
p.sub{color:var(--muted); font-size:.85rem; margin:4px 0 14px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0;}
.card.accent{border-color:#3d5a52;}
label{display:block; font-size:.8rem; color:var(--muted); margin:12px 0 4px;}
input[type=text], input[type=number], textarea, select{

.verse{cursor:pointer; border-radius:4px; padding:1px 3px; transition:background .15s;}
.verse:hover{background:rgba(125,216,192,.09);}

.err{color:#e8a87c;}

var DANDC = 'doctrina y convenios';

/* ---------- estado ---------- */
var studies = LS.get('nv2_studies', []);
var notes = LS.get('nv2_notes', []);
var fontSize = LS.get('nv2_font', 19);

function persistStudies(){ LS.set('nv2_studies', studies); }
function currentStudy(){
  for (var i=0;i<studies.length;i++) if (studies[i].id===currentStudyId) return studies[i];

}

/* ---------- preguntas ---------- */
var QUESTIONS = [
  {tag:'TEXTO', q:'¿Qué afirma explícitamente el pasaje?', hint:'Anotá la idea o frase que el texto dice directamente, con la referencia exacta.'},
  {tag:'OBSERVACIÓN', q:'¿Qué observás en el texto?', hint:'Palabras repetidas, acciones, hablantes, destinatarios, contrastes, secuencia. Referencias exactas.'},
  {tag:'INFERENCIA / HIPÓTESIS', q:'¿Qué explicación posible surge del texto?', hint:'Apoyala en tus observaciones. Señalá qué parte es observación y cuál interpretación.'},

];

/* ---------- parseo de referencias ---------- */
function normBook(b){
  var s = b.toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'').trim();
  if (BOOKS[s]) return s;
  if (s.indexOf('doctrina')===0) return DANDC;
  var keys = Object.keys(BOOKS);
  for (var i=0;i<keys.length;i++){
    if (keys[i].indexOf(s)===0 && s.length>3) return keys[i];
  }
  return null;
}
/* Divide referencias por capítulo y por bloques de versículos. */
function parseRef(ref){
  var m = ref.match(/^((?:[1-4]\s+)?[A-Za-zÁÉÍÓÚÑáéíóúñ][A-Za-zÁÉÍÓÚÑáéíóúñ\s\.]*?)\s+(\d+)(?:\s*[-–—]\s*(\d+))?(?::\s*(.+))?$/);
  if (!m) return null;
  var bookRaw = m[1].trim();
  var book = normBook(bookRaw);
  if (!book) return null;
  var chapter = parseInt(m[2],10);
  var chapterTo = m[3] ? parseInt(m[3],10) : chapter;
  if (chapterTo < chapter || chapterTo - chapter > 49) return null;
  var groups = [];
  if (m[4]){
    var parts = m[4].split(',');
    for (var i=0;i<parts.length;i++){
      var p = parts[i].trim().replace(/[–—]/g,'-').match(/^(\d+)(?:\s*-\s*(\d+))?$/);
      if (p){ var from=parseInt(p[1],10); var to=p[2]?parseInt(p[2],10):from; groups.push({from:from,to:to}); }
    }
  }
  if (!groups.length) groups.push({from:1,to:Infinity}); /* capítulo completo */
  var blocks = groups.map(function(g){
    var label = (g.to===Infinity) ? String(chapter)
      : (g.from===g.to ? (chapter+':'+g.from) : (chapter+':'+g.from+'-'+g.to));
    return {label:label, from:g.from, to:g.to};
  });
  return {book:book, bookName:bookRaw, chapter:chapter, chapterTo:chapterTo, blocks:blocks};
}

/* extrae referencias de un resumen importado */
var REF_RE = /((?:[1-4]\s+)?[A-ZÁÉÍÓÚÑ][a-záéíóúñ\.]*(?:\s+[a-záéíóúñ]+)*?)\s+(\d+(?:\s*[-–—]\s*\d+)?(?::\s*(?:\d+(?:\s*[-–—]\s*\d+)?(?:\s*,\s*\d+(?:\s*[-–—]\s*\d+)?)*)?)?)/g;
var CHAPTER_MORE_RE = /;\s*(\d+)(?:\s*[-–—]\s*(\d+))?(?::\s*([\d\s,–—-]+))?/g;
function parseSummary(text){
  var lines = text.split(/\r?\n/);
  var dayLabel = 'Sin día';
  var found = [];
  var seen = {};
  function addRef(str, day){
    var parsed = parseRef(str);
    if (!parsed) return;
    var refs = [];
    if (parsed.chapterTo > parsed.chapter){
      for (var ch=parsed.chapter; ch<=parsed.chapterTo; ch++) refs.push(parsed.bookName + ' ' + ch);
    } else refs.push(str);
    refs.forEach(function(ref){
      var k = ref.toLowerCase().replace(/\s+/g,' ').trim();
      if (seen[k]) return;
      seen[k] = true;
      found.push({ref:ref, day:day});
    });
  }
  for (var i=0;i<lines.length;i++){
    var ln = lines[i];
    var dm = ln.match(/^\s*(?:D[ií]a|D[IÍ]A)\s*(\d+)/i);
    if (dm){ dayLabel = 'Día ' + dm[1]; ln = ln.replace(dm[0],'').replace(/^\s*[-–—:]+\s*/,''); }
    var wm = ln.match(/^\s*(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b/i);
    if (wm){ dayLabel = wm[1][0].toUpperCase()+wm[1].slice(1).toLowerCase(); ln = ln.slice(wm[0].length).replace(/^\s*[-–—:]+\s*/,''); }
    if (!ln.trim()) continue;
    REF_RE.lastIndex = 0;
    var m;
    while ((m = REF_RE.exec(ln)) !== null){
      var book = normBook(m[1].trim());
      if (!book) continue;
      addRef(m[1].trim() + ' ' + m[2], dayLabel);
      /* capítulos adicionales tras punto y coma: "Ezequiel 1–3; 33–34; 36–37; 47" */
      var rest = ln.slice(m.index + m[0].length);
      CHAPTER_MORE_RE.lastIndex = 0;
      var cm;
      while ((cm = CHAPTER_MORE_RE.exec(rest)) !== null){
        var chs = [parseInt(cm[1],10)];
        if (cm[2]){
          var toCh = parseInt(cm[2],10); var c = chs[0]+1; var n=0;
          while (c<=toCh && n<12){ chs.push(c); c++; n++; }
        }
        for (var j=0;j<chs.length;j++){
          addRef(m[1].trim() + ' ' + chs[j] + (cm[3] ? ':' + cm[3].trim() : ''), dayLabel);
        }
      }
    }
  }
  return found;
}

  return 'https://www.churchofjesuschrist.org/study/scriptures/' + b.s + '/' + b.c + '/' + chapter + '?lang=spa';
}

  function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
  function(u){ return 'https://corsproxy.io/?url=' + encodeURIComponent(u); },

];

function fetchWithTimeout(url, ms){
  return new Promise(function(resolve, reject){
    var done = false;
    var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    var t = setTimeout(function(){ if(!done){ done=true; ctrl && ctrl.abort(); reject(new Error('timeout')); } }, ms||12000);
    fetch(url, ctrl ? {signal: ctrl.signal} : {}).then(function(r){
      if (!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    }).then(function(txt){
      if (!done){ done=true; clearTimeout(t); resolve(txt); }
    }).catch(function(e){
      if (!done){ done=true; clearTimeout(t); reject(e); }
    });
  });
}

/* del HTML de la página oficial de escrituras, extrae versículos */
function versesFromHtml(html){
  try {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    /* elimina basura */
    doc.querySelectorAll('script,style,sup,a.note-ref,a.studynote,header,footer,nav,.studyNotesWrapper,.reference').forEach(function(el){ el.remove(); });
    var verses = {};
    var count = 0;
    /* la página oficial pone cada versículo en un <p> */
    var ps = doc.querySelectorAll('p');
    ps.forEach(function(p){
      var txt = p.textContent.replace(/\[[^\]]*\]/g,' ').replace(/\s+/g,' ').trim();
      if (!txt || txt.length < 4) return;
      if (/^(chapter|cap[ií]tulo|previous|next|anteriores|siguientes|footnotes|notas|contents|[ií]ndice|image|listen|audio|share|save|related content)/i.test(txt)) return;
      if (/^\d+$/.test(txt)) return;
      var vm = txt.match(/^(\d{1,3})\s+(.+)$/);
      if (vm && parseInt(vm[1],10) > 0 && parseInt(vm[1],10) < 300){
        var n = parseInt(vm[1],10);
        if (verses[n]) verses[n] += ' ' + vm[2].trim(); else verses[n] = vm[2].trim();
        count++;
      } else if (count > 0) {
        var last = lastVerse(verses);
        if (last) verses[last] += ' ' + txt;
      }
    });
    if (count >= 2) return verses;
  } catch(e){}
  return null;
}
function lastVerse(v){ var ks = Object.keys(v); return ks.length ? ks[ks.length-1] : null; }

/* de texto plano/markdown (r.jina.ai) extrae versículos por línea */
function versesFromText(txt){
  var verses = {};
  var count = 0;
  var lines = txt.split(/\r?\n/);
  for (var i=0;i<lines.length;i++){
    var ln = lines[i].replace(/\[[^\]]*\]/g,' ').replace(/#+\s*/,'').replace(/\s+/g,' ').trim();
    if (!ln) continue;
    var vm = ln.match(/^(\d{1,3})\s+(.+)$/);
    if (vm && parseInt(vm[1],10)>0 && parseInt(vm[1],10)<300){
      var n = parseInt(vm[1],10);
      if (verses[n]) verses[n] += ' ' + vm[2].trim(); else verses[n] = vm[2].trim();
      count++;
    } else if (count>0 && !/^[-*|_]|^image|^title|^url|^source:|^markdown/i.test(ln)) {
      var last = lastVerse(verses);
      if (last) verses[last] += ' ' + ln;
    }
  }
  return count >= 2 ? verses : null;
}

function bollsUrl(book, chapter){
  var b = BOOKS[book];
  if (!b || !b.b) return null;
  return 'https://bolls.life/RV1960/' + encodeURIComponent(b.b) + '/' + chapter + '/';
}

function fetchChapter(book, chapter, manualText){
  var key = book + '|' + chapter;
  if (chapterCache[key]) return Promise.resolve(chapterCache[key]);
  if (manualText){
    var v = versesFromText(manualText) || versesFromHtml('<p>' + manualText.replace(/\r?\n/g,'</p><p>') + '</p>');
    if (v){ var mc = {verses:v, src:'Manual (RV2009)'}; chapterCache[key]=mc; LS.set('nv2_chapters', chapterCache); return Promise.resolve(mc); }
  }
  var attempts = [];
  var url = churchUrl(book, chapter);
  if (url){
    PROXIES.forEach(function(px){ attempts.push({type:'church', url:px(url)}); });
  }
  var bu = bollsUrl(book, chapter);
  if (bu) attempts.push({type:'bolls', url:bu});
  var idx = 0;
  function tryNext(){
    if (idx >= attempts.length) return Promise.reject(new Error('sin texto'));
    var a = attempts[idx++];
    return fetchWithTimeout(a.url, 14000).then(function(txt){
      var verses = null, src = 'Santa Biblia RV2009';
      if (a.type === 'bolls'){
        var arr = JSON.parse(txt);
        verses = {};
        arr.forEach(function(x){ verses[x.verse] = x.text; });
        src = 'RV1960 (alternativa)';
      } else {
        verses = /<html/i.test(txt) ? versesFromHtml(txt) : versesFromText(txt);
      }
      if (!verses || !Object.keys(verses).length) throw new Error('sin versículos');
      var c = {verses:verses, src:src};
      chapterCache[key]=c; LS.set('nv2_chapters', chapterCache);
      return c;
    }).catch(function(){ return tryNext(); });
  }
  return tryNext();
}

/* ---------- audio (TTS con velocidad) ---------- */
var TTS = {
  playing: -1, utter: null, playlist: null, playlistRate: 1, playMode: null, currentItem: null,
  stop: function(){
    try { speechSynthesis.cancel(); } catch(e){}
    this.playing = -1; this.utter = null; this.playlist = null; this.currentItem = null; this.playMode = null;
    updateAudioUI(); updateStudyAudioUI('Reproducción detenida');
  },
  speak: function(blockIdx, text, rate){
    if (!('speechSynthesis' in window)) { alert('Tu navegador no soporta lectura en voz alta.'); return; }
    try { speechSynthesis.cancel(); } catch(e){}
    this.playlist = null; this.currentItem = null; this.playMode = null;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.rate = rate || 1;
    var voices = speechSynthesis.getVoices() || [];
    var es = voices.filter(function(v){ return /es[-_]/i.test(v.lang); });
    if (es.length) u.voice = es[0];
    var self = this;
    u.onend = function(){ self.playing = -1; self.utter=null; updateAudioUI(); updateStudyAudioUI(''); };
    u.onerror = function(){ self.playing = -1; self.utter=null; updateAudioUI(); updateStudyAudioUI(''); };
    this.playing = blockIdx; this.utter = u;
    speechSynthesis.speak(u);
    updateAudioUI(); updateStudyAudioUI('');
  },
  playPlaylist: function(items, rate, mode){
    if (!('speechSynthesis' in window)) { alert('Tu navegador no soporta lectura en voz alta.'); return; }
    try { speechSynthesis.cancel(); } catch(e){}
    this.playlist = items.slice(); this.playlistRate = rate || 1; this.playMode = mode; this.playing = -2;
    this.nextPlaylistItem();
  },
  nextPlaylistItem: function(){
    var self = this;
    if (!this.playlist || !this.playlist.length){
      this.playing = -1; this.utter = null; this.playlist = null; this.currentItem = null; this.playMode = null;
      updateAudioUI(); updateStudyAudioUI('Reproducción terminada'); return;
    }
    this.currentItem = this.playlist.shift();
    var u = new SpeechSynthesisUtterance(this.currentItem.text);
    u.lang = 'es-ES'; u.rate = this.playlistRate;
    var voices = speechSynthesis.getVoices() || [];
    var es = voices.filter(function(v){ return /es[-_]/i.test(v.lang); });
    if (es.length) u.voice = es[0];
    u.onend = function(){ if (self.playlist) self.nextPlaylistItem(); };
    u.onerror = function(){ if (self.playlist) self.nextPlaylistItem(); };
    this.playing = -2; this.utter = u; speechSynthesis.speak(u);
    updateAudioUI(); updateStudyAudioUI('Reproduciendo…');
  },
  changePlaylistRate: function(rate){
    if (this.playing !== -2 || !this.playlist) return;
    if (this.currentItem) this.playlist.unshift(this.currentItem);
    try { speechSynthesis.cancel(); } catch(e){}
    this.playlistRate = rate || 1; this.nextPlaylistItem();
  },
  pause: function(){ try{ speechSynthesis.pause(); }catch(e){} },
  resume: function(){ try{ speechSynthesis.resume(); }catch(e){} }
};

function buildAudioItems(study, selectedIndex){
  var passages = selectedIndex == null ? study.passages : [study.passages[selectedIndex]];
  var tasks = [];
  passages.forEach(function(p){
    var parsed = parseRef(p.ref);
    if (!parsed) throw new Error('No pude interpretar la referencia: ' + p.ref);
    for (var ch=parsed.chapter; ch<=parsed.chapterTo; ch++) tasks.push({passage:p, parsed:parsed, chapter:ch});
  });
  return tasks.reduce(function(chain, task){
    return chain.then(function(items){
      return fetchChapter(task.parsed.book, task.chapter).then(function(chap){
        var verses = Object.keys(chap.verses).map(Number).sort(function(a,b){return a-b;}).filter(function(n){
          return task.parsed.blocks.some(function(b){ return n>=b.from && (b.to===Infinity || n<=b.to); });
        });
        if (!verses.length) return items;
        var body = verses.map(function(n){ return n + '. ' + chap.verses[n]; }).join(' ');
        var label = task.passage.day + '. ' + task.parsed.bookName + ' ' + task.chapter + '. ';
        items.push({text:label + body});
        return items;
      });
    });
  }, Promise.resolve([]));
}

function playStudyAudio(mode){
  if (TTS.playing === -2 && TTS.playMode === mode){
    try {
      if (speechSynthesis.paused) speechSynthesis.resume(); else speechSynthesis.pause();
      updateStudyAudioUI('');
    } catch(e){ TTS.stop(); }
    return;
  }
  var study = currentStudy();
  if (!study) return;
  var status = document.getElementById('studyAudioStatus');
  if (status) status.textContent = mode==='plan' ? 'Preparando el plan semanal…' : 'Preparando el pasaje…';
  var selectedIndex = mode==='plan' ? null : study.cur;
  buildAudioItems(study, selectedIndex).then(function(items){
    if (!items.length) throw new Error('No encontré texto disponible para reproducir. Cargá el texto manualmente y volvé a intentar.');
    var speed = parseFloat(document.getElementById('studySpeed').value)||1;
    TTS.playPlaylist(items, speed, mode);
  }).catch(function(err){
    if (status) status.textContent = '';
    alert(err.message || 'No pude preparar el audio. Revisá la conexión o pegá el texto del capítulo.');
  });
}

function updateStudyAudioUI(message){
  var isPlaylist = TTS.playing === -2;
  var paused = isPlaylist && ('speechSynthesis' in window) && speechSynthesis.paused;
  var planBtn = document.getElementById('btnListenPlan');

  var status = document.getElementById('studyAudioStatus');
  if (status && message !== undefined) status.textContent = message || (isPlaylist ? 'Reproduciendo…' : '');
}

function shortRef(ref){
  var m = ref.match(/^((?:[1-4]\s+)?\S+)\s+(\d+)(?::\s*(.+))?$/);
  if (!m) return ref;
  var parts = m[3] ? m[3].split(',').map(function(x){return x.trim();}) : [];
  var brief = m[1] + ' ' + m[2] + (parts.length ? ':' + parts[0].replace(/\s*[-–—]\s*/,'-') : '');
  return brief.length > 14 ? brief.slice(0,13)+'…' : brief;
}
function debounce(fn, ms){ var t; return function(){ var a=arguments,c=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(c,a); }, ms); }; }

    });
    if (!h) h = '<div class="card"><p class="err">No encontré el texto de ' + esc(p.ref) + '.</p><button class="btn" id="btnManual">Pegar texto de este capítulo</button></div>';
    h += '<p class="sub">Tocá un versículo para marcarlo 🔖; los marcados se usan como respuesta con el botón 📎 de cada pregunta. Tocá de nuevo para desmarcar.</p>';
    h += '<div class="row"><button class="btn small ghost" id="btnManual">Pegar texto manual (RV2009 desde Gospel Library)</button><button class="btn small ghost" id="btnReload">🔄 Volver a buscar</button></div>';
    container.innerHTML = h;

    container.querySelectorAll('.verse').forEach(function(el){
      el.onclick = function(){
        var n = parseInt(el.getAttribute('data-v'),10);
        if (!p.marks) p.marks = {};
        p.marks[n] = !p.marks[n];
        if (!p.marks[n]) delete p.marks[n];
        persistStudies();
        el.classList.toggle('sel');
        renderMarkerBar(parsedNow, passageNow);
      };
    });
    container.querySelectorAll('[data-b]').forEach(function(b){
      var bi = b.getAttribute('data-b');
      if (b.id.indexOf('play')===0) b.onclick = function(){
        var btn = document.getElementById('play'+bi);
        if (TTS.playing === parseInt(bi,10)){
          try {
            if (speechSynthesis.paused){ speechSynthesis.resume(); btn.innerHTML = '⏸ Pausar'; }
            else { speechSynthesis.pause(); btn.innerHTML = '▶ Continuar'; }
          } catch(e){ TTS.stop(); }
          return;
        }
        var text = blockText(bi); var rate = parseFloat(document.getElementById('spd'+bi).value)||1;
        TTS.speak(parseInt(bi,10), text, rate);
      };
      if (b.id.indexOf('stop')===0) b.onclick = function(){ TTS.stop(); };
    });
    container.querySelectorAll('.speedsel').forEach(function(sel){
      sel.onchange = function(){
        var bi = sel.getAttribute('data-b');
        /* cambiar velocidad en caliente: reinicia con la nueva */
        if (TTS.playing === parseInt(bi,10)){
          var text = blockText(bi);
          TTS.speak(parseInt(bi,10), text, parseFloat(sel.value)||1);
        }
      };
    });
    var mb = document.getElementById('btnManual');
    if (mb) mb.onclick = function(){ askManual(parsed, p); };
    var rb = document.getElementById('btnReload');
    if (rb) rb.onclick = function(){
      delete chapterCache[parsed.book+'|'+parsed.chapter];
      LS.set('nv2_chapters', chapterCache);
      renderBlocks(parsed, p);
    };
  }).catch(function(e){
    container.innerHTML = '<div class="card"><p class="err">No pude obtener el texto automáticamente (el sitio oficial puede estar ocupado).</p>'
      + '<p class="sub">Podés pegar el texto del capítulo ' + parsed.chapter + ' desde Gospel Library (es la misma RV2009) y queda guardado para siempre.</p>'
      + '<button class="btn acc" id="btnManual">Pegar texto manual</button> '
      + '<button class="btn" id="btnRetry">🔄 Reintentar</button></div>';
    document.getElementById('btnManual').onclick = function(){ askManual(parsed, p); };
    document.getElementById('btnRetry').onclick = function(){
      delete chapterCache[parsed.book+'|'+parsed.chapter];
      renderBlocks(parsed, p);
    };
  });
}
function blockText(bi){
  var el = document.getElementById('blk'+bi);
  var out = [];
  el.querySelectorAll('.verse').forEach(function(v){
    out.push(v.textContent.trim());
  });
  return out.join(' ');
}
function updateAudioUI(){
  view.querySelectorAll('.block').forEach(function(blk, bi){
    var play = blk.querySelector('[id^=play]'); var stop = blk.querySelector('[id^=stop]');
    if (!play) return;
    if (TTS.playing === bi){ play.innerHTML = '⏸ Pausar'; if(stop) stop.style.display=''; }
    else { play.innerHTML = '▶ Escuchar'; if(stop) stop.style.display='none'; }
  });
}

function askManual(parsed, p){
  var box = document.getElementById('modalBox');
  box.innerHTML = '<h3>Pegar texto de ' + esc(parsed.bookName + ' ' + parsed.chapter) + '</h3>'
    + '<p class="sub">Copiá el capítulo desde Gospel Library o tu Biblia RV2009 y pegalo acá (ideal: un versículo por línea, empezando con su número).</p>'
    + '<textarea id="manualTxt" style="min-height:220px;"></textarea>'
    + '<div class="row" style="margin-top:10px;"><button class="btn acc" id="mSave">Guardar</button><button class="btn ghost" id="mCancel">Cancelar</button></div>';
  document.getElementById('modal').classList.add('open');
  document.getElementById('mCancel').onclick = function(){ document.getElementById('modal').classList.remove('open'); };
  document.getElementById('mSave').onclick = function(){
    var txt = document.getElementById('manualTxt').value;
    delete chapterCache[parsed.book+'|'+parsed.chapter];
    fetchChapter(parsed.book, parsed.chapter, txt).then(function(){
      document.getElementById('modal').classList.remove('open');
      renderBlocks(parsed, p);
    }).catch(function(){ alert('No pude reconocer versículos en ese texto.'); });
  };
}

/* ---------- marcados -> respuestas ---------- */
function renderMarkerBar(parsed, p){
  var bar = document.getElementById('markerbar'); if (!bar) return;
  var marks = p.marks ? Object.keys(p.marks).map(Number).sort(function(a,b){return a-b;}) : [];
  var h = '<span class="badge ' + (marks.length?'on':'') + '">🔖 Marcados: ' + marks.length + '</span>';
  if (marks.length){
    h += '<span class="badge">' + esc(parsed.bookName + ' ' + parsed.chapter + ':' + marks.join(', ')) + '</span>';
    h += '<button class="btn small ghost" id="clearMarks">Limpiar</button>';
  }
  bar.innerHTML = h;
  var cm = document.getElementById('clearMarks');
  if (cm) cm.onclick = function(){
    p.marks = {}; persistStudies();
    view.querySelectorAll('.verse.sel').forEach(function(el){ el.classList.remove('sel'); });
    renderMarkerBar(parsed, p);
  };
}
function useMarks(qi){
  var s = currentStudy(); var p = s.passages[s.cur];
  var parsed = parseRef(p.ref);
  var marks = p.marks ? Object.keys(p.marks).map(Number).sort(function(a,b){return a-b;}) : [];
  if (!marks.length){ alert('Primero marcá al menos un versículo tocándolo en el texto.'); return; }
  var chap = chapterCache[parsed.book+'|'+parsed.chapter];
  var ta = document.getElementById('ans'+qi);
  var quote = marks.map(function(n){
    var t = chap && chap.verses[n] ? chap.verses[n] : '«versículo ' + n + '»';
    return '«' + t + '» (' + parsed.bookName + ' ' + parsed.chapter + ':' + n + ')';
  }).join('\n');
  ta.value = (ta.value ? ta.value.replace(/\s*$/,'') + '\n\n' : '') + quote;
  saveAnswers(); saveFlash('Versículos marcados agregados a la pregunta ' + (qi+1));
}

/* ---------- repaso 5 min ---------- */
var repasoTimer = null;
function startRepaso(){
  var s = currentStudy(); var p = s.passages[s.cur];
  var qi = 0;
  var box = document.getElementById('modalBox');
  function step(){
    clearInterval(repasoTimer);
    if (qi >= QUESTIONS.length){
      box.innerHTML = '<div style="text-align:center;"><div style="font-size:2rem;">🎉</div><h3>¡Repaso completado!</h3><button class="btn acc" id="rClose">Entendido</button></div>';
      document.getElementById('rClose').onclick = function(){ document.getElementById('modal').classList.remove('open'); };
      return;
    }
    var q = QUESTIONS[qi];
    var t = 60;
    box.innerHTML = '<span class="badge on">Repaso · ' + (qi+1) + '/5 · 1 min por pregunta</span>'
      + '<h3>' + esc(q.q) + '</h3>'
      + '<div class="timerbar"><div id="tfill"></div></div>'
      + '<div style="min-height:100px; font-size:1.05rem; white-space:pre-wrap;">' + esc(p.answers[qi] || '(Sin respuesta guardada)') + '</div>'
      + '<div class="row" style="justify-content:space-between;"><button class="btn small ghost" id="rSkip">Saltar ⏭</button><button class="btn small" id="rEnd">Terminar</button></div>';
    var fill = document.getElementById('tfill');
    fill.style.width = '100%';
    var start = Date.now();
    repasoTimer = setInterval(function(){
      var el = (Date.now()-start)/1000;
      fill.style.width = Math.max(0, 100*(1-el/60)) + '%';
      if (el >= 60){ qi++; step(); }
    }, 200);
    document.getElementById('rSkip').onclick = function(){ qi++; step(); };
    document.getElementById('rEnd').onclick = function(){ qi = 99; clearInterval(repasoTimer); step(); };
  }
  document.getElementById('modal').classList.add('open');
  step();
}

/* ---------- exportar markdown ---------- */
function exportMd(){
  var s = currentStudy(); var p = s.passages[s.cur];
  var parsed = parseRef(p.ref);
  var chap = chapterCache[parsed.book+'|'+parsed.chapter];
  var marks = p.marks ? Object.keys(p.marks).map(Number).sort(function(a,b){return a-b;}) : [];
  var md = '# ' + p.ref + '\n\n**' + s.name + '** · ' + p.day + ' · ' + new Date().toLocaleDateString('es-AR') + '\n\n';
  if (marks.length){
    md += '## Versículos marcados\n\n';
    marks.forEach(function(n){
      md += '> ' + (chap && chap.verses[n] ? chap.verses[n] : '') + ' (' + parsed.bookName + ' ' + parsed.chapter + ':' + n + ')\n';
    });
    md += '\n';
  }
  QUESTIONS.forEach(function(q,i){
    md += '## ' + q.tag + ' — ' + q.q + '\n\n' + ((p.answers && p.answers[i]) ? p.answers[i] + '\n\n' : '_(sin respuesta)_\n\n');
  });
  md += '---\nSanta Biblia Reina-Valera 2009\n';
  var blob = new Blob([md], {type:'text/markdown'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = p.ref.replace(/[^\w\d]+/g,'-') + '.md';
  a.click();
}

/* ---------- arranque ---------- */
document.getElementById('btnHome').onclick = function(){ saveAnswers(); renderHome(); };
document.getElementById('btnFontUp').onclick = function(){ setFont(fontSize+1); };
document.getElementById('btnFontDown').onclick = function(){ setFont(fontSize-1); };

if (currentStudy()) renderStudy(0); else renderHome();

/* precarga de voces en algunos móviles */
if ('speechSynthesis' in window){
  try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function(){ speechSynthesis.getVoices(); }; } catch(e){}
}
})();
